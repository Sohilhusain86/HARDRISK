<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جماعت اولیٰ الف - پرائیویٹ میسنجر</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-green: #064e3b;
      --deep-green: #022c22;
      --bg-dark: #01140e;
      --gold-main: #d4af37;
      --gold-accent: #facc15;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --admin-badge: #dc2626;
      --student-badge: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, var(--primary-green) 0%, var(--deep-green) 60%, var(--bg-dark) 100%);
      color: var(--text-light);
      font-family: 'Noto Nastaliq Urdu', 'Amiri', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: rgba(3, 40, 29, 0.95);
      border-left: 1px solid var(--gold-main);
      border-right: 1px solid var(--gold-main);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-header {
      background: rgba(1, 20, 14, 0.98);
      border-bottom: 2px solid var(--gold-main);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .group-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .group-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--gold-main), var(--gold-accent));
      color: var(--bg-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .group-name {
      font-size: 1.15rem;
      color: var(--gold-accent);
      line-height: 1.4;
    }

    .group-status {
      font-size: 0.75rem;
      color: #34d399;
      font-family: 'Poppins', sans-serif;
      direction: ltr;
      text-align: right;
    }

    .header-icons {
      display: flex;
      gap: 10px;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--gold-main);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }

    .pinned-notice-bar {
      background: rgba(212, 175, 55, 0.15);
      border-bottom: 1px dashed var(--gold-main);
      padding: 8px 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-accent);
    }

    .chat-messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-card {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.8;
      word-wrap: break-word;
    }

    .msg-mine {
      align-self: flex-start;
      background: linear-gradient(145deg, #065f46, #044a37);
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-top-right-radius: 4px;
    }

    .msg-other {
      align-self: flex-end;
      background: rgba(1, 20, 14, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-top-left-radius: 4px;
    }

    .msg-sender-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 2px;
    }

    .sender-title {
      font-weight: bold;
      color: var(--gold-accent);
      font-size: 0.85rem;
    }

    .role-badge {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
    }

    .badge-admin {
      background: var(--admin-badge);
      color: #fff;
    }

    .badge-student {
      background: var(--student-badge);
      color: #fff;
    }

    .msg-time {
      font-size: 0.65rem;
      color: var(--text-muted);
      direction: ltr;
      text-align: left;
      margin-top: 4px;
      font-family: 'Poppins', sans-serif;
    }

    .btn-del-msg {
      background: none;
      border: none;
      color: #f87171;
      font-size: 0.75rem;
      cursor: pointer;
      margin-right: 6px;
    }

    .chat-bottom-dock {
      background: rgba(1, 20, 14, 0.98);
      border-top: 1px solid var(--gold-main);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input-box {
      flex: 1;
      background: rgba(6, 78, 59, 0.6);
      border: 1px solid var(--gold-main);
      border-radius: 25px;
      padding: 8px 16px;
      color: #fff;
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-send {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--gold-main), var(--gold-accent));
      color: var(--bg-dark);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .login-overlay {
      position: absolute;
      inset: 0;
      background: rgba(1, 20, 14, 0.96);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .login-box {
      background: rgba(6, 78, 59, 0.85);
      border: 2px solid var(--gold-main);
      border-radius: 20px;
      padding: 26px 20px;
      width: 100%;
      max-width: 380px;
    }

    .login-input {
      width: 100%;
      background: #01140e;
      border: 1px solid var(--gold-main);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      text-align: center;
    }

    .btn-enter {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-main), var(--gold-accent));
      color: var(--bg-dark);
      border: none;
      border-radius: 30px;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-modal {
      position: absolute;
      inset: 0;
      background: rgba(1, 20, 14, 0.95);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 20px;
    }

    .admin-modal.open {
      display: flex;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--gold-main);
      padding-bottom: 12px;
      margin-bottom: 16px;
      color: var(--gold-accent);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <div class="login-overlay" id="login-screen">
      <div class="login-box">
        <h2 style="color: var(--gold-accent); margin-bottom: 10px; font-size: 1.5rem;">جماعت اولیٰ الف میسنجر</h2>
        <p style="color: #cbd5e1; font-size: 0.85rem; margin-bottom: 20px;">براہِ کرم اپنا نام اور پاسورڈ درج کر کے داخل ہوں</p>
        
        <input type="text" id="user-name-field" class="login-input" placeholder="آپ کا مبارک نام...">
        <input type="password" id="user-pass-field" class="login-input" placeholder="پاسورڈ (صرف ایڈمن کے لیے اختیاری)">
        
        <button class="btn-enter" id="btn-login-submit">گروپ میں داخل ہوں</button>
      </div>
    </div>

    <div class="admin-modal" id="admin-panel">
      <div class="admin-header">
        <h3><i class="fa-solid fa-shield-halved"></i> ایڈمن کنٹرول پینل</h3>
        <button class="header-btn" id="btn-close-admin"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="color: var(--gold-main); display: block; margin-bottom: 6px; font-size: 0.9rem;">پِن نوٹس تبدیل کریں:</label>
        <input type="text" id="new-notice-input" class="login-input" placeholder="تمام طلبہ کے لیے نیا اعلان لکھیں...">
        <button class="btn-enter" id="btn-update-notice" style="padding: 8px; font-size: 0.9rem;">نوٹس اپڈیٹ کریں</button>
      </div>

      <div style="margin-top: 15px;">
        <button class="btn-enter" id="btn-clear-all-chat" style="background: #dc2626; color: #fff; padding: 10px; font-size: 0.9rem;">
          <i class="fa-solid fa-trash"></i> پوری چیٹ صاف کریں (Clear All)
        </button>
      </div>
    </div>

    <header class="top-header">
      <div class="group-info">
        <div class="group-avatar">۱-الف</div>
        <div>
          <div class="group-name">جماعت اولیٰ الف 🌙</div>
          <div class="group-status" id="live-user-status">Online Group</div>
        </div>
      </div>
      <div class="header-icons">
        <button class="header-btn" id="btn-open-admin" title="ایڈمن پینل" style="display: none;"><i class="fa-solid fa-crown"></i></button>
        <button class="header-btn" id="btn-sound-toggle" title="آواز آن/آف"><i class="fa-solid fa-volume-high"></i></button>
      </div>
    </header>

    <div class="pinned-notice-bar" id="pinned-notice-display">
      <i class="fa-solid fa-thumbtack"></i>
      <span id="notice-text">تمام طلبہ وقت پر کلاس میں حاضر رہیں اور سبق یاد رکھیں۔</span>
    </div>

    <main class="chat-messages-area" id="chat-stream"></main>

    <footer class="chat-bottom-dock">
      <input type="text" class="chat-input-box" id="chat-input-field" placeholder="یہاں پیغام لکھیں...">
      <button class="btn-send" id="btn-send-msg">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </footer>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKey_ReplaceWithYourOwnIfAvailable",
      authDomain: "ula-alif-messenger.firebaseapp.com",
      databaseURL: "https://ula-alif-messenger-default-rtdb.firebaseio.com",
      projectId: "ula-alif-messenger",
      storageBucket: "ula-alif-messenger.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    let db = null;
    let useFirebase = false;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      useFirebase = true;
    } catch(e) {}

    let currentUser = { name: "", role: "student" };
    const ADMIN_PASSKEY = "razavi123";
    let soundEnabled = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playMsgTone() {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e) {}
    }

    const loginOverlay = document.getElementById('login-screen');
    const nameField = document.getElementById('user-name-field');
    const passField = document.getElementById('user-pass-field');
    const loginBtn = document.getElementById('btn-login-submit');
    const adminCrownBtn = document.getElementById('btn-open-admin');

    loginBtn.addEventListener('click', () => {
      const enteredName = nameField.value.trim();
      const enteredPass = passField.value.trim();

      if (!enteredName) {
        alert("براہِ کرم اپنا نام درج فرمائیں۔");
        return;
      }

      currentUser.name = enteredName;
      if (enteredPass === ADMIN_PASSKEY) {
        currentUser.role = "admin";
        adminCrownBtn.style.display = "block";
        alert("خوش آمدید حضرت! آپ بطور ایڈمن لاگ اِن ہو چکے ہیں۔");
      } else {
        currentUser.role = "student";
      }

      loginOverlay.style.display = "none";
      loadMessages();
    });

    const chatStream = document.getElementById('chat-stream');
    const inputField = document.getElementById('chat-input-field');
    const sendBtn = document.getElementById('btn-send-msg');

    function sendMessage() {
      const text = inputField.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const newMsg = {
        id: Date.now().toString(),
        sender: currentUser.name,
        role: currentUser.role,
        content: text,
        time: timeStr,
        timestamp: Date.now()
      };

      if (useFirebase && db) {
        db.ref('messages').push(newMsg);
      } else {
        let localMsgs = JSON.parse(localStorage.getItem('ula_alif_msgs') || '[]');
        localMsgs.push(newMsg);
        localStorage.setItem('ula_alif_msgs', JSON.stringify(localMsgs));
        renderMessages(localMsgs);
      }

      inputField.value = "";
      playMsgTone();
    }

    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function renderMessages(messagesList) {
      chatStream.innerHTML = "";
      messagesList.forEach(msg => {
        const isMine = msg.sender === currentUser.name;
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg-card ${isMine ? 'msg-mine' : 'msg-other'}`;

        const roleClass = msg.role === 'admin' ? 'badge-admin' : 'badge-student';
        const roleLabel = msg.role === 'admin' ? 'ایڈمن' : 'طالب علم';

        let deleteBtnHtml = '';
        if (currentUser.role === 'admin') {
          deleteBtnHtml = `<button class="btn-del-msg" onclick="deleteMessage('${msg.id}')" title="حذف کریں"><i class="fa-solid fa-trash-can"></i></button>`;
        }

        msgDiv.innerHTML = `
          <div class="msg-sender-row">
            <span class="sender-title">${msg.sender}</span>
            <div>
              <span class="role-badge ${roleClass}">${roleLabel}</span>
              ${deleteBtnHtml}
            </div>
          </div>
          <div>${msg.content}</div>
          <div class="msg-time">${msg.time}</div>
        `;
        chatStream.appendChild(msgDiv);
      });
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function loadMessages() {
      if (useFirebase && db) {
        db.ref('messages').on('value', (snapshot) => {
          const data = snapshot.val();
          const list = data ? Object.values(data) : [];
          renderMessages(list);
        });
      } else {
        const localMsgs = JSON.parse(localStorage.getItem('ula_alif_msgs') || '[]');
        renderMessages(localMsgs);
      }
    }

    window.deleteMessage = function(msgId) {
      if (!confirm("کیا آپ اس پیغام کو حذف کرنا چاہتے ہیں؟")) return;
      if (useFirebase && db) {
        db.ref('messages').orderByChild('id').equalTo(msgId).once('value', snapshot => {
          snapshot.forEach(child => child.ref.remove());
        });
      } else {
        let localMsgs = JSON.parse(localStorage.getItem('ula_alif_msgs') || '[]');
        localMsgs = localMsgs.filter(m => m.id !== msgId);
        localStorage.setItem('ula_alif_msgs', JSON.stringify(localMsgs));
        renderMessages(localMsgs);
      }
    };

    const adminPanel = document.getElementById('admin-panel');
    const closeAdminBtn = document.getElementById('btn-close-admin');
    const updateNoticeBtn = document.getElementById('btn-update-notice');
    const newNoticeInput = document.getElementById('new-notice-input');
    const noticeDisplay = document.getElementById('notice-text');
    const clearAllBtn = document.getElementById('btn-clear-all-chat');

    adminCrownBtn.addEventListener('click', () => adminPanel.classList.add('open'));
    closeAdminBtn.addEventListener('click', () => adminPanel.classList.remove('open'));

    updateNoticeBtn.addEventListener('click', () => {
      const val = newNoticeInput.value.trim();
      if (!val) return;
      noticeDisplay.textContent = val;
      if (useFirebase && db) db.ref('pinned_notice').set(val);
      else localStorage.setItem('ula_alif_notice', val);
      newNoticeInput.value = "";
      adminPanel.classList.remove('open');
    });

    clearAllBtn.addEventListener('click', () => {
      if (confirm("کیا آپ تمام پیغامات صاف کرنا چاہتے ہیں؟")) {
        if (useFirebase && db) db.ref('messages').remove();
        else {
          localStorage.removeItem('ula_alif_msgs');
          renderMessages([]);
        }
        adminPanel.classList.remove('open');
      }
    });

    const soundToggleBtn = document.getElementById('btn-sound-toggle');
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
    });
  </script>
</body>
</html>
