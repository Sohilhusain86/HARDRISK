<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جماعت اولیٰ الف - لائیو میسنجر</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>

  <style>
    :root {
      --primary-green: #075e54;
      --deep-green: #128c7e;
      --chat-bg: #0b141a;
      --msg-mine: #005c4b;
      --msg-other: #202c33;
      --gold-accent: #facc15;
      --gold-main: #d4af37;
      --text-main: #e9edef;
      --text-muted: #8696a0;
      --admin-color: #ef4444;
      --student-color: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #000;
      color: var(--text-main);
      font-family: 'Noto Nastaliq Urdu', 'Amiri', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl;
    }

    .app-screen {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: var(--chat-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.85);
    }

    .top-header {
      background: var(--primary-green);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .group-info { display: flex; align-items: center; gap: 10px; }

    .group-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--gold-main), var(--gold-accent));
      color: #01140e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: bold;
    }

    .group-title { font-size: 1.15rem; font-weight: bold; color: #fff; line-height: 1.3; }

    .group-status {
      font-size: 0.78rem;
      color: #bbf7d0;
      font-family: 'Poppins', sans-serif;
      direction: ltr;
      text-align: right;
    }

    .header-icons { display: flex; gap: 10px; }

    .header-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
    }

    .pinned-notice-bar {
      background: #1f2c34;
      border-bottom: 1px solid rgba(250, 204, 21, 0.3);
      padding: 8px 14px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-accent);
    }

    .chat-messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #0b141a;
      background-image: radial-gradient(#1f2c34 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.8;
      word-wrap: break-word;
      position: relative;
    }

    .msg-mine { align-self: flex-start; background: var(--msg-mine); border-top-right-radius: 2px; }
    .msg-other { align-self: flex-end; background: var(--msg-other); border-top-left-radius: 2px; }

    .msg-sender-name {
      font-size: 0.82rem;
      font-weight: bold;
      color: var(--gold-accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 2px;
    }

    .role-tag {
      font-size: 0.62rem;
      padding: 1px 6px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
    }

    .tag-admin { background: var(--admin-color); color: #fff; }
    .tag-student { background: var(--student-color); color: #01140e; font-weight: bold; }

    .msg-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      direction: ltr;
      margin-top: 5px;
      font-family: 'Poppins', sans-serif;
    }

    .admin-loc-tag {
      color: #fb7185;
      font-size: 0.72rem;
      font-family: 'Poppins', sans-serif;
      direction: ltr;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .msg-action-btn {
      cursor: pointer;
      font-size: 0.88rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-delete {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.15);
    }

    .btn-ban {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
    }

    .msg-img-preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 5px;
      display: block;
      cursor: pointer;
    }

    .msg-audio-player {
      width: 220px;
      margin-top: 6px;
      height: 36px;
      direction: ltr;
    }

    .file-attachment-card {
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
      direction: ltr;
    }

    .file-attachment-card a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
    }

    #typing-indicator {
      display: none;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: #00a884;
      font-style: italic;
      background: #202c33;
    }

    .chat-bottom-dock {
      background: #202c33;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-input-box {
      flex: 1;
      background: #2a3942;
      border: none;
      border-radius: 25px;
      padding: 10px 16px;
      color: #fff;
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-dock-action {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 6px;
      transition: color 0.2s;
    }

    .btn-dock-action:hover { color: #00a884; }

    .btn-mic.recording {
      color: #ef4444;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }

    .btn-send {
      width: 42px;
      height: 42px;
      background: var(--deep-green);
      color: #fff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .login-overlay {
      position: absolute;
      inset: 0;
      background: #111b21;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .login-card {
      background: #202c33;
      border-radius: 20px;
      padding: 26px 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .login-input {
      width: 100%;
      background: #111b21;
      border: 1px solid #00a884;
      border-radius: 12px;
      padding: 11px 14px;
      color: #fff;
      font-family: 'Poppins', 'Noto Nastaliq Urdu', serif;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
    }

    .btn-login {
      width: 100%;
      background: #00a884;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-modal {
      position: absolute;
      inset: 0;
      background: #111b21;
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .admin-modal.open { display: flex; }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #202c33;
      padding-bottom: 12px;
      margin-bottom: 16px;
      color: var(--gold-accent);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <div class="login-overlay" id="login-screen">
      <div class="login-card">
        <h2 style="color: #00a884; margin-bottom: 8px; font-size: 1.5rem;">جماعت اولیٰ الف میسنجر</h2>
        <p style="color: var(--text-muted); font-size: 0.82rem; margin-bottom: 16px;">اپنا نام اور موبائل نمبر / رول نمبر درج کریں</p>
        
        <input type="text" id="user-name" class="login-input" placeholder="آپ کا مبارک نام (مثلاً: زید)">
        <input type="tel" id="user-phone" class="login-input" placeholder="موبائل نمبر یا رول نمبر (Unique ID)">
        <input type="password" id="user-pass" class="login-input" placeholder="پاسورڈ (صرف ایڈمن کے لیے)">
        
        <button class="btn-login" id="btn-login">گروپ جوائن کریں</button>
      </div>
    </div>

    <div class="admin-modal" id="admin-panel">
      <div class="admin-header">
        <h3><i class="fa-solid fa-shield-halved"></i> ایڈمن کنٹرول پینل</h3>
        <button class="header-btn" id="btn-close-admin"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="color: #00a884; display: block; margin-bottom: 6px; font-size: 0.9rem;">پِن نوٹس تبدیل کریں:</label>
        <input type="text" id="new-notice" class="login-input" placeholder="نیا اعلان یا سبق کا نوٹس لکھیں...">
        <button class="btn-login" id="btn-update-notice">نوٹس لائیو نشر کریں</button>
      </div>

      <div>
        <button class="btn-login" id="btn-clear-chat" style="background: #475569;">
          <i class="fa-solid fa-trash"></i> سکرین صاف کریں
        </button>
      </div>
    </div>

    <header class="top-header">
      <div class="group-info">
        <div class="group-avatar">۱-الف</div>
        <div>
          <div class="group-title">جماعت اولیٰ الف 🌙</div>
          <div class="group-status" id="live-members-count">آن لائن: رابطہ ہو رہا ہے...</div>
        </div>
      </div>
      <div class="header-icons">
        <button class="header-btn" id="btn-admin-crown" title="ایڈمن پینل" style="display: none;"><i class="fa-solid fa-crown" style="color: #facc15;"></i></button>
        <button class="header-btn" id="btn-sound"><i class="fa-solid fa-volume-high"></i></button>
      </div>
    </header>

    <div class="pinned-notice-bar">
      <i class="fa-solid fa-thumbtack"></i>
      <span id="notice-display">تمام طلبہ وقت پر کلاس میں حاضر رہیں اور سبق یاد رکھیں۔</span>
    </div>

    <main class="chat-messages-area" id="chat-stream"></main>

    <div id="typing-indicator">کوئی ٹائپ کر رہا ہے...</div>

    <footer class="chat-bottom-dock">
      <input type="file" id="file-selector" style="display: none;" accept="image/*,.pdf,.doc,.docx,.zip">
      <button class="btn-dock-action" id="btn-attach" title="فائل یا تصویر بھیجیں"><i class="fa-solid fa-paperclip" style="transform: rotate(45deg);"></i></button>
      <button class="btn-dock-action btn-mic" id="btn-mic" title="آڈیو ریکارڈ کریں"><i class="fa-solid fa-microphone"></i></button>
      <input type="text" class="chat-input-box" id="msg-input" placeholder="یہاں پیغام لکھیں...">
      <button class="btn-send" id="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
    </footer>

  </div>

  <script>
    const CHANNEL_ID = 'uledCtWauV1C5nWP';
    const CLOUD_NAME = 'xgkhockl';
    const UPLOAD_PRESET = 'd9xe6u2l';

    let drone = null;
    let room = null;
    let currentUser = { name: "", phone: "", displayName: "", role: "student", location: "Unknown" };
    const ADMIN_PASSKEY = "razavi123";
    let soundEnabled = true;
    let typingTimer = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentStream = null;

    function detectLocation() {
      function fallbackToIP() {
        fetch('https://ipwho.is/')
          .then(res => res.json())
          .then(data => {
            if (data.success && data.city) {
              const reg = data.region_code || data.region || "";
              currentUser.location = reg ? `${data.city}, ${reg}` : data.city;
            }
          })
          .catch(() => {});
      }

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
              .then(res => res.json())
              .then(data => {
                if (data && data.address) {
                  const place = data.address.village || data.address.suburb || data.address.town || data.address.city || "";
                  const region = data.address.state_district || data.address.state || "";
                  currentUser.location = (place && region) ? `${place}, ${region}` : (place || region || "India");
                } else {
                  fallbackToIP();
                }
              }).catch(() => fallbackToIP());
          },
          () => fallbackToIP(),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        fallbackToIP();
      }
    }
    detectLocation();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch(e) {}
    }

    const loginScreen = document.getElementById('login-screen');
    const userNameInput = document.getElementById('user-name');
    const userPhoneInput = document.getElementById('user-phone');
    const userPassInput = document.getElementById('user-pass');
    const loginBtn = document.getElementById('btn-login');
    const adminCrown = document.getElementById('btn-admin-crown');

    loginBtn.addEventListener('click', async () => {
      const name = userNameInput.value.trim();
      const phone = userPhoneInput.value.trim().replace(/[^0-9a-zA-Z]/g, '');
      const pass = userPassInput.value.trim();

      if (!name) {
        alert("براہِ کرم اپنا مبارک نام درج کریں۔");
        return;
      }
      if (!phone) {
        alert("براہِ کرم موبائل نمبر یا رول نمبر درج کریں۔");
        return;
      }

      currentUser.name = name;
      currentUser.phone = phone;
      currentUser.displayName = `${name} (${phone})`;

      if (pass === ADMIN_PASSKEY) {
        currentUser.role = "admin";
        adminCrown.style.display = "block";
      }

      if (window.checkUserBanned) {
        const isBanned = await window.checkUserBanned(currentUser.phone);
        if (isBanned) {
          alert("آپ کو ایڈمن کی طرف سے مستقل بلاک کر دیا گیا ہے۔");
          return;
        }
      }

      loginScreen.style.display = "none";
      connectRealtimeServer();
      
      if (window.startFirebaseListening) {
        window.startFirebaseListening();
      }
    });

    function connectRealtimeServer() {
      drone = new ScaleDrone(CHANNEL_ID, {
        data: { name: currentUser.displayName, role: currentUser.role }
      });

      drone.on('open', error => {
        if (error) return console.error(error);
        room = drone.subscribe('observable-ula-alif-room');

        room.on('members', members => updateOnlineCount(members.length));
        room.on('member_join', member => updateOnlineCount(room.members.length));
        room.on('member_leave', member => updateOnlineCount(room.members.length));

        room.on('data', (data) => {
          if (data.type === 'notice') {
            document.getElementById('notice-display').textContent = data.text;
          } 
          else if (data.type === 'typing' && data.sender !== currentUser.displayName) {
            const typingDiv = document.getElementById('typing-indicator');
            typingDiv.textContent = `${data.sender} ٹائپ کر رہا ہے...`;
            typingDiv.style.display = 'block';
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { typingDiv.style.display = 'none'; }, 1500);
          }
          else if (data.type === 'ban' && (data.targetPhone === currentUser.phone)) {
            alert("آپ کو ایڈمن نے مستقل بلاک کر دیا۔");
            location.reload();
          }
        });
      });
    }

    function updateOnlineCount(count) {
      document.getElementById('live-members-count').textContent = `آن لائن: ${count} اراکین`;
    }

    const chatStream = document.getElementById('chat-stream');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('btn-send');
    const fileSelector = document.getElementById('file-selector');
    const attachBtn = document.getElementById('btn-attach');
    const micBtn = document.getElementById('btn-mic');

    msgInput.addEventListener('input', () => {
      if (drone) {
        drone.publish({
          room: 'observable-ula-alif-room',
          message: { type: 'typing', sender: currentUser.displayName }
        });
      }
    });

    async function sendChatMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      if (window.checkUserBanned) {
        const isBanned = await window.checkUserBanned(currentUser.phone);
        if (isBanned) {
          alert("آپ بلاک ہیں، میسج نہیں بھیج سکتے۔");
          return;
        }
      }

      if(window.sendFirebaseMessage) {
        window.sendFirebaseMessage(currentUser.name, currentUser.phone, currentUser.displayName, currentUser.role, text, currentUser.location);
      }
      msgInput.value = "";
    }

    sendBtn.addEventListener('click', sendChatMessage);
    msgInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMessage(); });

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
        method: 'POST',
        body: formData
      });
      return await res.json();
    }

    attachBtn.addEventListener('click', () => fileSelector.click());

    fileSelector.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      msgInput.placeholder = "فائل اپلوڈ ہو رہی ہے...";
      msgInput.disabled = true;

      try {
        const result = await uploadToCloudinary(file);
        if (result.secure_url) {
          const isImg = file.type.startsWith('image/');
          const fileMsg = isImg ? `[IMG](${result.secure_url})` : `[FILE:${file.name}](${result.secure_url})`;
          if (window.sendFirebaseMessage) {
            window.sendFirebaseMessage(currentUser.name, currentUser.phone, currentUser.displayName, currentUser.role, fileMsg, currentUser.location);
          }
        }
      } catch (err) {
        alert("اپلوڈ ناکام رہا: " + err.message);
      } finally {
        msgInput.placeholder = "یہاں پیغام لکھیں...";
        msgInput.disabled = false;
        fileSelector.value = "";
      }
    });

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true }
          });

          mediaRecorder = new MediaRecorder(currentStream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());

            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const audioFile = new File([audioBlob], `audio_${Date.now()}.mp3`, { type: 'audio/mp3' });
            
            msgInput.placeholder = "آڈیو اپلوڈ ہو رہی ہے...";
            try {
              const res = await uploadToCloudinary(audioFile);
              if (res.secure_url && window.sendFirebaseMessage) {
                window.sendFirebaseMessage(currentUser.name, currentUser.phone, currentUser.displayName, currentUser.role, `[AUDIO](${res.secure_url})`, currentUser.location);
              }
            } catch(e) {
              alert("آڈیو اپلوڈ نہ ہو سکی");
            } finally {
              msgInput.placeholder = "یہاں پیغام لکھیں...";
            }
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
        } catch (err) {
          alert("مائیک کی اجازت چیک کریں: " + err.message);
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    });

    // Admin direct Ban Action Trigger
    window.triggerAdminBan = function(targetPhone, targetName) {
      if (!targetPhone) {
        alert("اس طالب علم کا فون نمبر دستیاب نہیں ہے۔");
        return;
      }
      if (confirm(`کیا آپ واقعی ${targetName} (${targetPhone}) کو مستقل بلاک کرنا چاہتے ہیں؟`)) {
        if (window.banUserPermanently) {
          window.banUserPermanently(targetPhone);
        }
        if (drone) {
          drone.publish({
            room: 'observable-ula-alif-room',
            message: { type: 'ban', targetPhone: targetPhone }
          });
        }
        alert(`${targetName} کو مستقل بلاک کر دیا گیا۔`);
      }
    };

    window.appendMessage = function(data, msgKey) {
      const isMine = data.senderPhone === currentUser.phone || data.sender === currentUser.displayName;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}`;
      if (msgKey) bubble.id = `msg-${msgKey}`;

      const roleClass = data.role === 'admin' ? 'tag-admin' : 'tag-student';
      const roleLabel = data.role === 'admin' ? 'ایڈمن' : 'طالب علم';

      let contentHtml = `<div>${data.text}</div>`;
      
      if (typeof data.text === 'string' && data.text.startsWith('[IMG](')) {
        const match = data.text.match(/\((.*?)\)/);
        if (match) {
          const url = match[1];
          contentHtml = `<img src="${url}" class="msg-img-preview" alt="Image" onclick="window.open('${url}','_blank')"/>`;
        }
      } else if (typeof data.text === 'string' && data.text.startsWith('[AUDIO](')) {
        const match = data.text.match(/\((.*?)\)/);
        if (match) {
          const url = match[1];
          contentHtml = `<audio src="${url}" controls class="msg-audio-player"></audio>`;
        }
      } else if (typeof data.text === 'string') {
        const fileMatch = data.text.match(/^\[FILE:(.*?)\]\((.*?)\)$/);
        if (fileMatch) {
          contentHtml = `
            <div class="file-attachment-card">
              <i class="fa-solid fa-file-arrow-down" style="font-size: 1.3rem; color: #38bdf8;"></i>
              <div><a href="${fileMatch[2]}" target="_blank" download>${fileMatch[1]}</a></div>
            </div>
          `;
        }
      }

      const locationHtml = (currentUser.role === 'admin' && data.location && data.location !== 'Unknown')
        ? `<span class="admin-loc-tag"><i class="fa-solid fa-location-dot"></i> ${data.location}</span>`
        : '';

      // Direct Action Buttons for Admin (Delete + Direct Ban)
      let adminActionsHtml = '';
      if (currentUser.role === 'admin') {
        const phoneArg = data.senderPhone || '';
        const nameArg = (data.sender || 'User').replace(/'/g, "\\'");
        
        const deleteBtn = msgKey ? `<span class="msg-action-btn btn-delete" onclick="window.deleteFirebaseMessage('${msgKey}')" title="میسج ڈیلیٹ کریں"><i class="fa-solid fa-trash-can"></i></span>` : '';
        const banBtn = (data.role !== 'admin' && phoneArg) ? `<span class="msg-action-btn btn-ban" onclick="window.triggerAdminBan('${phoneArg}', '${nameArg}')" title="اس طالب علم کو بلاک کریں"><i class="fa-solid fa-ban"></i></span>` : '';
        
        adminActionsHtml = `${banBtn} ${deleteBtn}`;
      }

      bubble.innerHTML = `
        <div class="msg-sender-name">
          <span>${data.displayName || data.sender}</span>
          <span class="role-tag ${roleClass}">${roleLabel}</span>
        </div>
        ${contentHtml}
        <div class="msg-footer">
          ${adminActionsHtml}
          ${locationHtml}
          <span>${data.time}</span>
          <i class="fa-solid fa-check-double" style="color: ${isMine ? '#53bdeb' : 'inherit'};"></i>
        </div>
      `;

      chatStream.appendChild(bubble);
      chatStream.scrollTop = chatStream.scrollHeight;
      playBeep();
    }

    const adminPanel = document.getElementById('admin-panel');
    adminCrown.addEventListener('click', () => adminPanel.classList.add('open'));
    document.getElementById('btn-close-admin').addEventListener('click', () => adminPanel.classList.remove('open'));

    document.getElementById('btn-update-notice').addEventListener('click', () => {
      const noticeVal = document.getElementById('new-notice').value.trim();
      if (!noticeVal || !drone) return;
      drone.publish({
        room: 'observable-ula-alif-room',
        message: { type: 'notice', text: noticeVal }
      });
      document.getElementById('new-notice').value = "";
      adminPanel.classList.remove('open');
    });

    document.getElementById('btn-clear-chat').addEventListener('click', () => {
      chatStream.innerHTML = "";
      adminPanel.classList.remove('open');
    });

    document.getElementById('btn-sound').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('btn-sound').innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
    });
  </script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, set, get, onChildAdded, onChildRemoved, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDpqKDayo6H0nVyjnT1JBPjpH8RjmwpvV0",
    authDomain: "ula-alif.firebaseapp.com",
    databaseURL: "https://ula-alif-default-rtdb.firebaseio.com",
    projectId: "ula-alif",
    storageBucket: "ula-alif.firebasestorage.app",
    messagingSenderId: "693272422991",
    appId: "1:693272422991:web:081c07b083e3549b0dd83a"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'messages');

    window.checkUserBanned = async function(phone) {
      if (!phone) return false;
      const snapshot = await get(ref(db, `banned_users/${phone}`));
      return snapshot.exists();
    };

    window.banUserPermanently = function(phone) {
      const cleanPhone = phone.replace(/[^0-9a-zA-Z]/g, '');
      set(ref(db, `banned_users/${cleanPhone}`), {
        bannedAt: Date.now()
      });
    };

    window.sendFirebaseMessage = function(name, phone, displayName, role, text, userLocation) {
      if(!text) return;
      const now = new Date();
      push(chatRef, {
        sender: name,
        senderPhone: phone,
        displayName: displayName,
        role: role,
        text: text,
        location: userLocation || "Unknown",
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now()
      });
    };

    window.deleteFirebaseMessage = function(key) {
      if (!confirm("کیا آپ واقعی یہ میسج ڈیلیٹ کرنا چاہتے ہیں؟")) return;

      const targetEl = document.getElementById(`msg-${key}`);
      if (targetEl) targetEl.style.opacity = '0.3';

      const itemRef = ref(db, `messages/${key}`);
      remove(itemRef)
        .then(() => {
          if (targetEl) targetEl.remove();
        })
        .catch((error) => {
          if (targetEl) targetEl.style.opacity = '1';
          alert("ڈیلیٹ کرنے میں خرابی: " + error.message);
        });
    };

    window.startFirebaseListening = function() {
      onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        if(window.appendMessage) {
          window.appendMessage(data, snapshot.key);
        }
      });

      onChildRemoved(chatRef, (snapshot) => {
        const el = document.getElementById(`msg-${snapshot.key}`);
        if (el) el.remove();
      });
    };
    
  } catch(error) {
    console.error("Firebase Initialization Error:", error);
  }
</script>
</body>
