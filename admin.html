<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUHAIL AI Admin</title><style>body{margin:0;background:#070b14;color:#eef4ff;font-family:system-ui;padding:20px}.box{max-width:1050px;margin:auto;background:#0d1322;border:1px solid #22304a;border-radius:18px;padding:20px}input,button{padding:11px;border-radius:9px;border:1px solid #293c5c;background:#09101c;color:#fff;margin:5px}button{cursor:pointer}.primary{background:#6ea8fe;color:#07101f;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{padding:15px;border:1px solid #22304a;border-radius:12px;background:#101a2b}.approve{background:#38d39f;color:#06150f;border:0}.reject{background:#ff6b7a;color:#21070a;border:0}.muted{color:#91a0ba;font-size:13px}</style></head><body><div class="box"><h1>SUHAIL AI Admin</h1><div id="login"><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button><div id="err" class="muted"></div></div><div id="panel" style="display:none"><button onclick="load()">Refresh</button><button onclick="logout()">Log out</button><h2>Pending payment requests</h2><div id="list" class="grid"></div><h2>Students</h2><div id="users" class="grid"></div></div></div><script>let token=localStorage.getItem('suhail_admin');const $=x=>document.getElementById(x);async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{const d=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const x=await d.json();if(!d.ok)throw Error(x.error);token=x.token;localStorage.setItem('suhail_admin',token);show();load()}catch(e){$('err').textContent=e.message}}function show(){$('login').style.display=token?'none':'block';$('panel').style.display=token?'block':'none'}async function load(){try{const d=await api('/api/admin/requests');$('list').innerHTML=d.requests.length?d.requests.map(r=>`<div class="card"><b>${r.plan} — ₹${r.amount}</b><p>${r.userName}<br>${r.userEmail}</p><div class="muted">UTR: ${r.utr||'not provided'}<br>${new Date(r.createdAt).toLocaleString()}</div><button class="approve" onclick="review('${r.id}','APPROVE')">Approve</button><button class="reject" onclick="review('${r.id}','REJECT')">Reject</button></div>`).join(''):'<div class="muted">No pending requests.</div>';const u=await api('/api/admin/users');$('users').innerHTML=u.users.map(x=>`<div class="card"><b>${x.name}</b><br>${x.email}<p>Plan: ${x.plan}<br>Until: ${x.activeUntil?new Date(x.activeUntil).toLocaleString():'—'}</p></div>`).join('')}catch(e){$('err').textContent=e.message}}async function review(id,action){if(!confirm(action==='APPROVE'?'Verify the actual payment and approve this request?':'Reject this payment request?'))return;try{await api('/api/admin/requests',{method:'POST',body:JSON.stringify({id,action})});load()}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('suhail_admin');token=null;show()}show();if(token)load();</script></body></html>
