<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محفوظ دستاویز / सुरक्षित दस्तावेज़</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: radial-gradient(circle at 50% 20%, #111b21, #080e13 80%); color: #e9edef; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
    .card { background: #182229; border: 1px solid rgba(0, 168, 132, 0.35); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); text-align: center; }
    .icon-lock { width: 56px; height: 56px; background: rgba(0, 168, 132, 0.15); border: 1px solid #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 24px; color: #00a884; }
    h2 { font-size: 1.2rem; margin-bottom: 6px; color: #fff; }
    p.subtitle { font-size: 0.8rem; color: #8696a0; margin-bottom: 18px; line-height: 1.5; }
    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
    .form-input { width: 100%; padding: 12px 14px; background: #0b141a; border: 1px solid #2a3942; border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none; }
    .form-input:focus { border-color: #00a884; }
    .btn-submit { width: 100%; padding: 12px; background: #00a884; border: none; border-radius: 10px; color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none; }
    
    #content-section { display: none; text-align: center; }
    .welcome-badge { display: inline-block; background: rgba(0, 168, 132, 0.15); border: 1px solid #00a884; color: #00ffa3; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 14px; }
    .file-box { background: #0b141a; border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 16px; margin-bottom: 18px; text-align: left; }
    .file-box h4 { font-size: 0.95rem; color: #fff; margin-bottom: 4px; }
    .file-box p { font-size: 0.75rem; color: #8696a0; }
    
    .btn-action { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px; border-radius: 10px; font-size: 0.92rem; font-weight: 600; margin-bottom: 10px; cursor: pointer; border: none; }
    .btn-read { background: #00a884; color: #fff; }
    .btn-download { background: #1f2c34; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .btn-lock-again { background: transparent; color: #8696a0; border: none; font-size: 0.78rem; cursor: pointer; margin-top: 12px; text-decoration: underline; }
    
    /* फुल स्क्रीन रीडर */
    #pdf-viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999999;
      flex-direction: column;
    }
    .viewer-header {
      background: #111b21;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a3942;
    }
    .viewer-header span { font-size: 0.85rem; color: #e9edef; font-weight: 600; }
    .btn-close-viewer { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    #pdf-viewer-overlay iframe { width: 100%; height: 100%; flex: 1; border: none; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div class="card" id="auth-section">
    <div class="icon-lock"><i class="fa-solid fa-file-shield"></i></div>
    <h2>محفوظ پی ڈی ایف (Protected PDF)</h2>
    <p class="subtitle">दस्तावेज़ खोलने के लिए नाम और पासवर्ड दर्ज करें।</p>
    <div class="form-group">
      <label for="user-name"><i class="fa-solid fa-user"></i> आपका नाम</label>
      <input type="text" id="user-name" class="form-input" placeholder="नाम दर्ज करें">
    </div>
    <div class="form-group">
      <label for="user-pass"><i class="fa-solid fa-key"></i> पासवर्ड</label>
      <input type="password" id="user-pass" class="form-input" placeholder="पासवर्ड दर्ज करें">
    </div>
    <button type="button" class="btn-submit" onclick="verifyAccess()"><i class="fa-solid fa-lock-open"></i> दाखिल हों (Open)</button>
    <div id="error-alert" class="error-msg">गलत पासवर्ड या नाम खाली है!</div>
  </div>

  <!-- OPTIONS SECTION -->
  <div class="card" id="content-section">
    <span class="welcome-badge" id="welcome-user">خوش آمدید!</span>
    <div class="file-box">
      <h4><i class="fa-solid fa-file-pdf" style="color:#ef4444; margin-right:6px;"></i> कक्षा 4 हिंदी पाठ 7: नकली हीरे</h4>
      <p>محفوظ دستاویز | Darsi wa Ilmi Mavad (50 प्रश्नोत्तरी)</p>
    </div>

    <!-- 1. फुल स्क्रीन रीडर बटन (बिना छोटे बॉक्स के) -->
    <button type="button" class="btn-action btn-read" onclick="openFullscreenPdf()">
      <i class="fa-solid fa-book-open-reader"></i> फुल स्क्रीन में साफ़ पढ़ें (Read Fullscreen)
    </button>

    <!-- 2. डायरेक्ट ब्राउज़र डाउनलोड (बिना ड्राइव ऐप खोले) -->
    <button type="button" class="btn-action btn-download" onclick="startDirectDownload()">
      <i class="fa-solid fa-file-arrow-down"></i> सीधे मोबाइल में डाउनलोड करें (Direct Download)
    </button>

    <button type="button" class="btn-lock-again" onclick="lockAgain()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> दोबारा लॉक करें (Lock Again)
    </button>
  </div>

  <!-- FULLSCREEN VIEWER -->
  <div id="pdf-viewer-overlay">
    <div class="viewer-header">
      <span><i class="fa-solid fa-file-pdf" style="color:#ef4444;"></i> कक्षा 4 हिंदी: नकली हीरे</span>
      <button type="button" class="btn-close-viewer" onclick="closeFullscreenPdf()">✕ बंद करें (Close)</button>
    </div>
    <iframe id="fullscreen-frame" src=""></iframe>
  </div>

  <script>
    const SECRET_KEY = "786786786786786786786786786786";
    const FILE_ID = "1xSLxk3toreZoU5vlI_SzVUq93nzzMRnv";

    function verifyAccess() {
      const name = document.getElementById('user-name').value.trim();
      const pass = document.getElementById('user-pass').value.trim();
      const err = document.getElementById('error-alert');
      if (!name) { err.innerText = "कृपया अपना नाम लिखें!"; err.style.display = 'block'; return; }
      if (pass !== SECRET_KEY) { err.innerText = "गलत पासवर्ड! एक्सेस नामंज़ूर।"; err.style.display = 'block'; return; }
      err.style.display = 'none';
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('content-section').style.display = 'block';
      document.getElementById('welcome-user').innerHTML = `<i class="fa-solid fa-circle-check"></i> स्वागत है, <b>${name}</b>`;
    }

    // मोबाइल के पूरे स्क्रीन पर साफ़ रीडर खोलना
    function openFullscreenPdf() {
      const viewer = document.getElementById('pdf-viewer-overlay');
      const frame = document.getElementById('fullscreen-frame');
      // Google docs viewer mobile me zoom aur swipe ke sath behtareen chalta hai
      frame.src = `https://drive.google.com/file/d/${FILE_ID}/preview`;
      viewer.style.display = 'flex';
    }

    function closeFullscreenPdf() {
      const viewer = document.getElementById('pdf-viewer-overlay');
      const frame = document.getElementById('fullscreen-frame');
      frame.src = "";
      viewer.style.display = 'none';
    }

    // बिना Google Drive ऐप को ट्रिगर किए डायरेक्ट ब्राउज़र डाउनलोड
    function startDirectDownload() {
      const directUrl = `https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&authuser=0`;
      
      const a = document.createElement('a');
      a.href = directUrl;
      a.setAttribute('download', 'Kaksha_4_Hindi_Nakli_Heere.pdf');
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function lockAgain() {
      closeFullscreenPdf();
      document.getElementById('user-name').value = '';
      document.getElementById('user-pass').value = '';
      document.getElementById('content-section').style.display = 'none';
      document.getElementById('auth-section').style.display = 'block';
    }
  </script>
</body>
</html>
